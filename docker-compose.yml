version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gst_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gst_fraud_db
      MYSQL_USER: gst_user
      MYSQL_PASSWORD: gst_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gst_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://gst_user:gst_password@mysql:3306/gst_fraud_db
      SECRET_KEY: competition_super_secret_jwt_key_2026
      LLM_PROVIDER: offline
      LLM_MODEL: deterministic-rule-engine
      PORT: 8000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gst_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container with Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar Telemetry Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>

  <!-- Radar Sweep Cone -->
  <path d="M 32 32 L 50 18 A 22 22 0 0 0 32 10 Z" fill="url(#radarSweep)"/>

  <!-- Central Emblem Shield -->
  <path d="M 32 14 L 46 20 C 46 33 39 44 32 48 C 25 44 18 33 18 20 Z" 
        fill="#090d16" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- GST Text Monogram inside Shield -->
  <text x="32" y="33" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9" 
        font-weight="900" 
        letter-spacing="0.8" 
        text-anchor="middle" 
        fill="#ffffff">
    GST
  </text>

  <!-- Telemetry Active Pulse Dot -->
  <circle cx="32" cy="40" r="2.2" fill="#10b981"/>
  <circle cx="32" cy="40" r="4" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.7"/>
</svg>
